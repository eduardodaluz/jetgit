name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Unit tests
        run: npm run test:unit

      - name: Build tests
        run: npm run build-tests

      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Integration tests
        env:
          JETGIT_FIXTURES_DIR: ${{ runner.temp }}/jetgit-fixtures
        shell: bash
        run: |
          node scripts/build-fixtures.mjs
          run_tests() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a node dist/test/runTest.js
            else
              node dist/test/runTest.js
            fi
          }
          # The VS Code download/version-resolution inside test-electron is
          # network-bound and flakes on runners (~15s request timeout).
          for attempt in 1 2 3; do
            if run_tests; then
              exit 0
            fi
            echo "::warning::integration attempt ${attempt} failed"
            sleep 10
          done
          echo "Integration tests failed after 3 attempts"
          exit 1

      - name: Package (valid VSIX)
        if: matrix.os == 'ubuntu-latest'
        run: npx vsce package

      - name: Upload VSIX artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jetgit-vsix
          path: '*.vsix'
